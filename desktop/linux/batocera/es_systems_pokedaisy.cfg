<?xml version="1.0"?>
<!--
  PokeDaisy as a system in Batocera's menu: your GBA games (the same folder, list and pictures as GBA), each one
  started in PokeDaisy with its companion. Copy this file to /userdata/system/configs/emulationstation/
  (\\BATOCERA\share\system\configs\emulationstation\) and restart Batocera.
-->
<systemList>
  <system>
    <fullname>PokeDaisy</fullname>
    <name>pokedaisy</name>
    <manufacturer>Nintendo</manufacturer>
    <release>2001</release>
    <hardware>portable</hardware>
    <path>/userdata/roms/gba</path>
    <extension>.gba .GBA .gb .GB .gbc .GBC .zip .ZIP .7z .7Z</extension>
    <command>/bin/bash /userdata/system/pokedaisy/batocera/launch.sh %ROM%</command>
    <platform>gba</platform>
    <theme>gba</theme>
  </system>
</systemList>
